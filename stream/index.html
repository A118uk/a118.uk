<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A118 · Live Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* =================================================================
       Base tokens
       ================================================================= */
    :root {
      --c-orange:     rgb(238, 115, 0);
      --c-amber:      rgb(247, 165, 27);
      --c-olive:      rgb(146, 151, 76);
      --c-sage:       rgb(100, 115, 97);
      --c-mauve:      rgb(93,  85,  90);
      --c-surface-0:  rgb(4, 4, 6);
      --c-surface-1:  rgb(18, 18, 20);
      --c-surface-2:  rgba(28, 28, 31, 0.72);
      --c-surface-3:  rgba(22, 22, 24, 0.82);
      --c-text-hi:    rgb(210, 210, 215);
      --c-text-mid:   rgb(190, 190, 195);
      --c-text-low:   rgb(90, 90, 100);
      --c-text-dim:   rgb(55, 55, 65);

      --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      --font-ui:      -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      --font-mono:    'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font-ui);
      color: var(--c-text-mid);
      background-color: rgb(39, 39, 41);
      line-height: 1.55;
    }

    /* Fixed parallax background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: transparent url('n67.webp') no-repeat center center;
      background-attachment: fixed;
      background-size: cover;
    }

    /* Dark overlay */
    .overlay {
      position: relative;
      background: rgba(22, 22, 24, 0.82);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =================================================================
       Logo stripe — identity element
       ================================================================= */
    .stripe-logo {
      width: 10px;
      height: 52px;
      background-image: linear-gradient(to bottom,
        var(--c-orange) 20%,
        var(--c-amber)  20% 40%,
        var(--c-olive)  40% 60%,
        var(--c-sage)   60% 80%,
        var(--c-mauve)  80%);
      border-radius: 0.25rem;
      flex-shrink: 0;
    }
    .stripe-logo.horizontal {
      width: 52px;
      height: 10px;
      background-image: linear-gradient(to right,
        var(--c-orange) 20%,
        var(--c-amber)  20% 40%,
        var(--c-olive)  40% 60%,
        var(--c-sage)   60% 80%,
        var(--c-mauve)  80%);
    }

    /* Top accent stripe on the stream frame */
    .stripe-h {
      height: 3px;
      border-radius: 2px;
      background-image: linear-gradient(to right,
        var(--c-orange) 20%,
        var(--c-amber)  20% 40%,
        var(--c-olive)  40% 60%,
        var(--c-sage)   60% 80%,
        var(--c-mauve)  80%);
      flex-shrink: 0;
    }

    /* =================================================================
       Header — compact
       ================================================================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(16, 16, 18, 0.90);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 1800px;
      margin: 0 auto;
      padding: 0.65rem 1.5rem;
    }

    .logo-mark {
      height: 50px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.05rem;
    }
    .title-block .title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--c-text-hi);
      letter-spacing: 0.01em;
      line-height: 1.1;
    }
    .title-block .subtitle {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--c-text-low);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Right side: live status */
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.18rem;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.60rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--c-sage);
      white-space: nowrap;
    }
    .status-line.dim { color: rgb(70, 70, 80); }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--c-olive);
      flex-shrink: 0;
      animation: blink 2.4s ease-in-out infinite;
    }
    .live-dot {
      background: var(--c-orange);
      box-shadow: 0 0 6px rgba(238, 115, 0, 0.6);
      animation: blink-live 1.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    @keyframes blink-live {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(238, 115, 0, 0.6); }
      50%       { opacity: 0.6; box-shadow: 0 0 2px rgba(238, 115, 0, 0.2); }
    }

    /* =================================================================
       Main content — stream fills remaining viewport height
       ================================================================= */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem 1rem;
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Stream container — expand to fill all available vertical space */
    .stream-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--c-surface-0);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 0.4rem;
      overflow: hidden;
      /* Soft orange glow to frame the content */
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(238, 115, 0, 0.06);
    }

    /* Thin accent stripe across the top of the stream card */
    .stream-stripe {
      height: 3px;
      flex-shrink: 0;
      background-image: linear-gradient(to right,
        var(--c-orange) 20%,
        var(--c-amber)  20% 40%,
        var(--c-olive)  40% 60%,
        var(--c-sage)   60% 80%,
        var(--c-mauve)  80%);
    }

    /* iframe wrapper — always 16:9 but expands to fill the card */
    .stream-frame {
      flex: 1;
      position: relative;
      background: var(--c-surface-0);
    }

    .stream-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* =================================================================
       Footer — minimal
       ================================================================= */
    footer {
      padding: 0.75rem 1.5rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .footer-text {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgb(55, 55, 65);
    }

    /* =================================================================
       Responsive
       ================================================================= */
    @media (max-width: 760px) {
      .header-inner { padding: 0.6rem 1rem; gap: 0.7rem; }
      .logo-mark { height: 38px; }
      .stripe-logo { height: 38px; width: 8px; }
      .title-block .title { font-size: 1rem; }
      .header-status { display: none; }
      .main { padding: 0.75rem 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="overlay">

    <!-- Header -->
    <header>
      <div class="header-inner">
        <img class="logo-mark" src="w92.svg" alt="A118">
        <div class="stripe-logo" aria-hidden="true"></div>
        <div class="title-block">
          <div class="title"></div>
          <div class="subtitle"></div>
        </div>
        <div class="header-right">
          <div class="header-status">
            <div class="status-line">
              <span class="status-dot live-dot"></span>
              Live now
            </div>
            <div class="status-line dim" id="clock">--:-- UTC</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Stream -->
    <main class="main">
      <div class="stream-container">
        <div class="stream-stripe" aria-hidden="true"></div>
        <div class="stream-frame">
          <iframe
            src="https://www.youtube-nocookie.com/embed/5wItIlt_oTY?si=uw0C4LgYmEnWm4bT"
            title="A118 Live Stream"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="stripe-logo horizontal" aria-hidden="true"></div>
    </footer>

  </div>

  <script>
    // Live UTC clock
    function updateClock() {
      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, '0');
      const mm = String(now.getUTCMinutes()).padStart(2, '0');
      const ss = String(now.getUTCSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hh}:${mm}:${ss} UTC`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
